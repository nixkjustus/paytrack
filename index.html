<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d6b4e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>PayTrack</title><style>
:root{--ink:#17221b;--muted:#6c776f;--cream:#f4f1e8;--card:#fffdf7;--green:#1d6b4e;--lime:#cde96b;--line:#dde1d9;--red:#b94235}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 100px}.brand{font-weight:900;font-size:22px;letter-spacing:-.6px}.brand i{color:var(--green);font-style:normal}.auth{padding-top:12vh}.auth h1{font-size:42px;line-height:1.02;letter-spacing:-2px;margin:24px 0 10px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 30px #163c2710;margin:14px 0}.field{display:block;margin:12px 0 5px;font-size:12px;font-weight:750;color:var(--muted)}input,select{width:100%;padding:13px 14px;border:1px solid #cfd6ce;border-radius:12px;background:white;color:var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:var(--green);color:white;font-weight:800;margin-top:14px;cursor:pointer}.link{border:0;background:none;color:var(--green);font-weight:750;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:900}.hero{background:var(--green);color:white;border:0;padding:22px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;opacity:.75;font-weight:800}.money{font-size:45px;font-weight:900;letter-spacing:-2px;margin:5px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff12;padding:12px;border-radius:14px}.stat b{display:block;font-size:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 6px}.section-title h2{font-size:19px}.shift{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.day{width:45px;height:45px;border-radius:13px;background:#e9eee8;display:grid;place-items:center;font-weight:850;line-height:1.05;text-align:center;font-size:12px}.shift-info{flex:1}.shift-info b{display:block}.shift-info small{color:var(--muted)}.hours{font-weight:850}.trash{border:0;background:none;color:#9b4f45;font-size:18px}.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:484px;width:calc(100% - 36px);padding:15px;border:0;border-radius:16px;background:var(--ink);color:white;font-weight:850;box-shadow:0 10px 30px #17221b50}.modal{position:fixed;inset:0;background:#0e1812aa;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:var(--cream);width:100%;max-width:520px;padding:20px 18px 30px;border-radius:25px 25px 0 0;max-height:92vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:26px}.tabs{display:flex;background:#e5e7df;padding:4px;border-radius:12px}.tabs button{flex:1;border:0;padding:9px;border-radius:9px;background:transparent;font-weight:750}.tabs .on{background:white}.error{color:var(--red);min-height:20px;font-size:13px;margin-top:8px}.empty{text-align:center;padding:24px;color:var(--muted)}@media(min-width:700px){.app{padding-top:35px}.modal{align-items:center}.sheet{border-radius:25px;max-height:90vh}}
</style></head><body><main class="app" id="app"></main><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n); let DATA, WEEK_OFFSET=0, installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
async function api(path,opt={}){
  // Standalone website: all data stays in this browser, with no server required.
  return localApi(path,opt)
}
let memoryState={users:{},current:null,nextId:1};
function readLocalState(){
  try{let value=localStorage.getItem('paytrack-data');if(value)return JSON.parse(value)}catch(e){}
  try{if(window.name&&window.name.startsWith('paytrack:'))return JSON.parse(window.name.slice(9))}catch(e){}
  return memoryState
}
function writeLocalState(state){
  memoryState=state;
  let value=JSON.stringify(state);
  try{localStorage.setItem('paytrack-data',value)}catch(e){}
  try{window.name='paytrack:'+value}catch(e){}
}
function localApi(path,opt={}){
  let state=readLocalState();
  let body=opt.body?JSON.parse(opt.body):{}; const save=()=>writeLocalState(state);
  if(path==='/api/data'){
    if(!state.current||!state.users[state.current])return Promise.resolve({authenticated:false});
    let u=state.users[state.current];return Promise.resolve({authenticated:true,user:{email:u.email,rate:u.rate,tax:u.tax,overtime:u.overtime,weekStart:u.weekStart??1,weekEnd:u.weekEnd??0},shifts:(u.shifts||[]).slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))});
  }
  if(path==='/api/signup'){
    let email=(body.email||'').trim().toLowerCase();if(!email||String(body.password||'').length<6)return Promise.reject(Error('Enter a valid email and a password of 6+ characters.'));
    if(state.users[email])return Promise.reject(Error('An account with that email already exists.'));
    state.users[email]={email,password:body.password,rate:20,tax:17.3,overtime:1.5,weekStart:1,weekEnd:0,shifts:[]};state.current=email;save();return Promise.resolve({ok:1});
  }
  if(path==='/api/login'){
    let email=(body.email||'').trim().toLowerCase(),u=state.users[email];if(!u||u.password!==body.password)return Promise.reject(Error('Email or password is incorrect.'));
    state.current=email;save();return Promise.resolve({ok:1});
  }
  let u=state.users[state.current];if(!u)return Promise.reject(Error('Unauthorized'));
  if(path==='/api/shifts'&&opt.method==='POST'){u.shifts.push({id:state.nextId++,...body,break_mins:Number(body.break_mins||0)});save();return Promise.resolve({ok:1})}
  if(path.startsWith('/api/shifts/')&&opt.method==='DELETE'){let id=Number(path.split('/').pop());u.shifts=u.shifts.filter(s=>s.id!==id);save();return Promise.resolve({ok:1})}
  if(path==='/api/settings'){u.rate=Number(body.rate);u.tax=Number(body.tax);u.overtime=Number(body.overtime);u.weekStart=Number(body.weekStart);u.weekEnd=Number(body.weekEnd);save();return Promise.resolve({ok:1})}
  if(path==='/api/logout'){state.current=null;save();return Promise.resolve({ok:1})}
  return Promise.reject(Error('Not found'));
}
function duration(s){let [a,b]=s.start.split(':').map(Number),[c,d]=s.end.split(':').map(Number),m=(c*60+d)-(a*60+b)-s.break_mins;if(m<0)m+=1440;return Math.max(0,m/60)}
function payPeriod(){let now=new Date(),start=new Date(now);start.setHours(0,0,0,0);let back=(now.getDay()-DATA.user.weekStart+7)%7;start.setDate(start.getDate()-back+(WEEK_OFFSET*7));let span=(DATA.user.weekEnd-DATA.user.weekStart+7)%7,end=new Date(start);end.setDate(start.getDate()+span);end.setHours(23,59,59,999);return{start,end}}
function calc(){let p=payPeriod(),included=DATA.shifts.filter(s=>{let d=new Date(s.date+'T12:00:00');return d>=p.start&&d<=p.end}),hrs=included.reduce((a,s)=>a+duration(s),0),reg=Math.min(40,hrs),ot=Math.max(0,hrs-40),gross=reg*DATA.user.rate+ot*DATA.user.rate*DATA.user.overtime,net=gross*(1-DATA.user.tax/100);return{hrs,reg,ot,gross,net,period:p,included}}
async function load(){DATA=await api('/api/data'); DATA.authenticated?dashboard():auth()}
function auth(){app.innerHTML=`<div class="auth"><div class="brand">Pay<i>Track</i></div><h1>Know your hours.<br>Own your payday.</h1><p class="muted">Log shifts, track overtime, and estimate your take-home pay.</p><div class="card"><div class="tabs"><button class="on" id="loginTab">Log in</button><button id="signupTab">Sign up</button></div><form id="authForm"><label class="field">EMAIL</label><input id="email" type="email" required placeholder="you@example.com"><label class="field">PASSWORD</label><input id="password" type="password" minlength="6" required placeholder="6+ characters"><div class="error" id="err"></div><button class="primary">Continue</button></form></div></div>`;let mode='login';loginTab.onclick=()=>set('login');signupTab.onclick=()=>set('signup');function set(x){mode=x;loginTab.className=x==='login'?'on':'';signupTab.className=x==='signup'?'on':''}authForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/'+mode,{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});load()}catch(x){err.textContent=x.message}}}
function dashboard(){let c=calc(),initial=DATA.user.email[0].toUpperCase(),range=`${c.period.start.toLocaleDateString('en',{month:'short',day:'numeric'})} – ${c.period.end.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}`;app.innerHTML=`<div class="top"><div><div class="brand">Pay<i>Track</i></div><small class="muted">${DATA.user.email}</small></div><button class="avatar" id="settings">${initial}</button></div><div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px"><button class="link" id="prevWeek">‹ Previous</button><div style="text-align:center"><b>${WEEK_OFFSET===0?'This week':'Past week'}</b><small class="muted" style="display:block">${range}</small></div><button class="link" id="nextWeek" ${WEEK_OFFSET>=0?'disabled':''}>Next ›</button></div><div class="card hero"><div class="eyebrow">Estimated take-home</div><div class="money">${money(c.net)}</div><div class="stats"><div class="stat"><span>Total hours</span><b>${c.hrs.toFixed(2)}</b></div><div class="stat"><span>Gross pay</span><b>${money(c.gross)}</b></div></div><p style="margin:12px 2px 0;opacity:.7;font-size:12px">Uses ${DATA.user.tax}% estimated deductions · overtime after 40 hours</p></div><div class="section-title"><h2>Shifts this period</h2><b>${c.ot?c.ot.toFixed(2)+' OT hrs':''}</b></div><div class="card">${c.included.length?c.included.map(shiftHTML).join(''):'<div class="empty">No shifts recorded for this week.</div>'}</div><button class="fab" id="add">＋ Add a shift</button>`;add.onclick=shiftModal;settings.onclick=settingsModal;prevWeek.onclick=()=>{WEEK_OFFSET--;dashboard()};nextWeek.onclick=()=>{if(WEEK_OFFSET<0){WEEK_OFFSET++;dashboard()}};document.querySelectorAll('.trash').forEach(b=>b.onclick=async()=>{if(confirm('Delete this shift?')){await api('/api/shifts/'+b.dataset.id,{method:'DELETE'});load()}})}
function shiftHTML(s){let d=new Date(s.date+'T12:00:00'),h=duration(s);return `<div class="shift"><div class="day">${d.toLocaleDateString('en',{month:'short'}).toUpperCase()}<br>${d.getDate()}</div><div class="shift-info"><b>${s.start} – ${s.end}</b><small>${s.note||((s.break_mins||0)+' min break')}</small></div><span class="hours">${h.toFixed(2)}h</span><button class="trash" data-id="${s.id}">×</button></div>`}
function open(html){sheet.innerHTML=html;modal.classList.add('open');$('.close').onclick=()=>modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')}
function shiftModal(){let today=new Date().toISOString().slice(0,10);open(`<div class="sheet-head"><h2>Add shift</h2><button class="close">×</button></div><form id="shiftForm"><label class="field">DATE</label><input id="date" type="date" value="${today}" required><div class="row"><div><label class="field">START</label><input id="start" type="time" value="09:00" required></div><div><label class="field">END</label><input id="end" type="time" value="17:00" required></div></div><label class="field">UNPAID BREAK (MINUTES)</label><input id="breakMins" type="number" min="0" value="30"><label class="field">NOTE (OPTIONAL)</label><input id="note" placeholder="e.g. Opening shift"><button class="primary">Save shift</button></form>`);shiftForm.onsubmit=async e=>{e.preventDefault();await api('/api/shifts',{method:'POST',body:JSON.stringify({date:date.value,start:start.value,end:end.value,break_mins:breakMins.value,note:note.value})});modal.classList.remove('open');load()}}
function dayOptions(selected){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${i==selected?'selected':''}>${d}</option>`).join('')}
function settingsModal(){let u=DATA.user;open(`<div class="sheet-head"><h2>Pay settings</h2><button class="close">×</button></div><form id="settingsForm"><label class="field">HOURLY RATE</label><input id="rate" type="number" min="0" step=".01" value="${u.rate}" required><label class="field">ESTIMATED TAXES & DEDUCTIONS (%)</label><input id="tax" type="number" min="0" max="100" step=".1" value="${u.tax}" required><label class="field">OVERTIME MULTIPLIER</label><input id="overtime" type="number" min="1" step=".1" value="${u.overtime}" required><div class="row"><div><label class="field">WEEK START DAY</label><select id="weekStart">${dayOptions(u.weekStart)}</select></div><div><label class="field">WEEK STOP DAY</label><select id="weekEnd">${dayOptions(u.weekEnd)}</select></div></div><button class="primary">Save settings</button></form><button class="primary" id="downloadSite" type="button" style="background:#e4eadf;color:#17221b">＋ Add PayTrack to Home Screen</button><p class="muted" id="installHelp" style="font-size:12px;text-align:center;margin:8px 0">Installs PayTrack like an app in Chrome.</p><button class="link" id="logout" style="width:100%;margin-top:8px">Log out</button>`);settingsForm.onsubmit=async e=>{e.preventDefault();await api('/api/settings',{method:'POST',body:JSON.stringify({rate:rate.value,tax:tax.value,overtime:overtime.value,weekStart:weekStart.value,weekEnd:weekEnd.value})});modal.classList.remove('open');load()};downloadSite.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installHelp.textContent='PayTrack can now be opened from your home screen.'}else{installHelp.innerHTML='In Chrome, tap the <b>⋮ menu</b>, then choose <b>Add to Home screen</b> or <b>Install app</b>.'}};logout.onclick=async()=>{await api('/api/logout',{method:'POST'});modal.classList.remove('open');load()}}
load();
</script></body></html>
